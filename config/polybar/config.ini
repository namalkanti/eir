[colors]
background = #070f1c
background-alt = #1e1e2e
foreground = #e0d9c7
primary = #ea6847
secondary = #5db2f8
alert = #e78284
disabled = #6c7086

[bar/main]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = "MesloLGS Nerd Font:size=10;2"

modules-left = xworkspaces
modules-center = date
modules-right = memory cpu disk wlan battery powermenu tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = " %name% "
label-active-background = ${colors.primary}
label-active-foreground = #070f1c
label-active-padding = 0

label-occupied = " %name% "
label-occupied-background = ${colors.background-alt}
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 0

label-urgent = " %name% "
label-urgent-background = ${colors.alert}
label-urgent-padding = 0

label-empty = " %name% "
label-empty-foreground = ${colors.disabled}
label-empty-padding = 0

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %I:%M %p
label = %date%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.secondary}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used:2%%

[module/disk]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#5db2f8}/%{F-} %percentage_used%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = %{F#ea6847}WiFi%{F-} %essid% %local_ip%
label-disconnected = %{F#6c7086}offline%{F-}

[module/battery]
type = internal/battery
full-at = 99
low-at = 10
battery = BAT0
adapter = ADP1
poll-interval = 5

[module/powermenu]
type = custom/text
label = " ⏻ "
label-foreground = ${colors.primary}
click-left = rofi-power-menu

[module/tray]
type = internal/tray
tray-size = 80%
tray-spacing = 4px
